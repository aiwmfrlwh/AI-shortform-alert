<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쇼츠</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#E4E6EB}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F12; font-family: 'IBM Plex Sans KR', sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; position: relative; background: #1C1E23; overflow: hidden">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #8A8E97">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"></rect><path d="M10 9l5 3-5 3z"></path></svg>
      <span style="font-size: 13px">[세로 쇼츠 영상 영역 · 9:16]</span>
    </div>

    <div style="position: absolute; top: 0; left: 0; right: 0; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: center; gap: 20px">
        <button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #FFFFFF; font: 700 17px 'IBM Plex Sans KR', sans-serif; border-bottom: 2px solid #FFFFFF">내 관심 분야</button>
        <button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #B8BBC2; font: 500 17px 'IBM Plex Sans KR', sans-serif">추천</button>
        <button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #B8BBC2; font: 500 17px 'IBM Plex Sans KR', sans-serif">팔로우 법안</button>
      </div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
          <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="position: absolute; right: 10px; bottom: 150px; display: flex; flex-direction: column; gap: 14px; align-items: center">
      <button onClick="{{toggleLike}}" aria-pressed="{{likePressed}}" aria-label="좋아요" style="width: 52px; border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 500 12px 'IBM Plex Sans KR', sans-serif; padding: 4px 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="{{likeFill}}" stroke="{{likeStroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
        <span>공감</span>
      </button>
      <button aria-label="저장" style="width: 52px; border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 500 12px 'IBM Plex Sans KR', sans-serif; padding: 4px 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        <span>저장</span>
      </button>
      <button aria-label="공유" style="width: 52px; border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 500 12px 'IBM Plex Sans KR', sans-serif; padding: 4px 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
        <span>공유</span>
      </button>
      <button aria-label="의견 남기기" style="width: 52px; border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 500 12px 'IBM Plex Sans KR', sans-serif; padding: 4px 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>의견</span>
      </button>
    </div>

    <div style="position: absolute; left: 16px; right: 76px; bottom: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="align-self: flex-start; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.16); padding: 4px 8px; border-radius: 6px">주거·부동산 · 60초 요약</span>
      <h1 style="margin: 0; font-size: 20px; line-height: 1.4; font-weight: 700; letter-spacing: -0.3px">전세사기 피해 지원,<br>무엇이 바뀌나</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #D5D7DC">[영상 설명 한두 줄 — 법안의 핵심 쟁점과 생활 속 변화]</p>
      <a href="BillDetail.dc.html" style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; color: #16181D; border-radius: 12px; padding: 10px 12px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 11px; font-weight: 600; color: {{accent}}">관련 법안 · 위원회 심사 중</span>
          <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">전세사기피해자 지원 특별법 개정안</span>
        </div>
        <span style="font-size: 13px; font-weight: 700; color: {{accent}}; white-space: nowrap">법안 보기</span>
      </a>
    </div>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.2)">
      <div style="width: 38%; height: 3px; background: #FFFFFF"></div>
    </div>
  </div>

  <nav aria-label="하단 메뉴" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #0E0F12; border-top: 1px solid #23252B; padding: 6px 8px 22px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #9DA1AA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>홈</a>
    <a href="Shorts.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 600; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"></rect><path d="M10 9l5 3-5 3z"></path></svg>쇼츠</a>
    <a href="Alerts.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #9DA1AA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>알림</a>
    <a href="Interests.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #9DA1AA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>내 관심</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2346D8","options":["#2346D8","#0F766E","#6D28D9","#16181D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { chip: '전체', liked: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2346D8';
    const base = "height: 36px; padding: 0 12px; border-radius: 18px; font: 500 13px 'IBM Plex Sans KR', sans-serif; cursor: pointer; ";
    const chips = ['전체', '주거·부동산', '노동·일자리', '디지털·AI'].map((label) => {
      const on = this.state.chip === label;
      return {
        label,
        pressed: on ? 'true' : 'false',
        style: base + (on ? 'background: #FFFFFF; color: #16181D; border: 0; font-weight: 600;' : 'background: rgba(0,0,0,0.45); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.3);'),
        pick: () => this.setState({ chip: label })
      };
    });
    const liked = this.state.liked;
    return {
      accent, chips,
      likePressed: liked ? 'true' : 'false',
      likeFill: liked ? '#F0536B' : 'none',
      likeStroke: liked ? '#F0536B' : '#FFFFFF',
      toggleLike: () => this.setState({ liked: !liked })
    };
  }
}
</script>
</body>
</html>

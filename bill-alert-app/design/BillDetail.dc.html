<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>법안 상세 · 진행 단계</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2346D8;text-decoration:none}a:hover{color:#1A35A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; font-family: 'IBM Plex Sans KR', sans-serif; color: #16181D; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 4px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #16181D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <button aria-label="공유" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #16181D">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
    </button>
  </header>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 0 20px">
    <section style="display: flex; flex-direction: column; gap: 8px">
      <span style="align-self: flex-start; font-size: 12px; font-weight: 600; color: {{accent}}; background: #EAEEFC; padding: 4px 8px; border-radius: 6px">주거·부동산</span>
      <h1 style="margin: 0; font-size: 22px; line-height: 1.4; font-weight: 700; letter-spacing: -0.4px">주택임대차보호법<br>일부개정법률안</h1>
      <p style="margin: 0; font-size: 13px; color: #5B5F68">대표발의 [의원명] 등 [N]인 · 발의일 [YYYY.MM.DD]</p>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E4E2DB; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 700; color: {{accent}}">AI 3줄 요약</div>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #2A2D33">[법안의 핵심 내용을 쉬운 말로 3줄 이내로 요약합니다. 누가, 무엇이, 어떻게 달라지는지를 중심으로 정리합니다.]</p>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700">진행 단계</h2>
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
        <div style="display: flex; gap: 12px">
          <div style="display: flex; flex-direction: column; align-items: center; width: 20px">
            <div style="{{s.dot}}"></div>
            <sc-if value="{{s.notLast}}" hint-placeholder-val="{{ true }}">
              <div style="width: 2px; flex: 1; min-height: 22px; background: {{s.line}}"></div>
            </sc-if>
          </div>
          <div style="flex: 1; display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 12px">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="{{s.labelStyle}}">{{s.label}}</span>
              <span style="font-size: 12px; color: #5B5F68">{{s.sub}}</span>
            </div>
            <sc-if value="{{s.current}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #C2410C; padding: 3px 8px; border-radius: 10px">진행 중</span>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </section>

    <a href="Shorts.dc.html" style="display: flex; align-items: center; gap: 12px; background: #16181D; border-radius: 14px; padding: 12px 14px; color: #FFFFFF">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #2E3138; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 600">이 법안 1분 쇼츠로 보기</span>
        <span style="font-size: 12px; color: #B8BBC2">관련 쇼츠 [N]개</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
    </a>
  </div>

  <div style="padding: 12px 20px 28px; background: #F6F5F1; border-top: 1px solid #E4E2DB">
    <button onClick="{{toggleFollow}}" aria-pressed="{{followPressed}}" style="{{followStyle}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span>{{followLabel}}</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2346D8","options":["#2346D8","#0F766E","#6D28D9","#16181D"]},"currentStep":{"editor":"range","default":2,"min":0,"max":5,"step":1},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { following: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2346D8';
    const cur = this.props.currentStep ?? 2;
    const defs = [
      ['접수·발의', '[YYYY.MM.DD]'],
      ['소관위원회 회부', '국토교통위원회'],
      ['소관위원회 심사', '법안심사소위원회 논의'],
      ['법제사법위원회', '체계·자구 심사'],
      ['본회의 심의', '표결'],
      ['정부 이송·공포', '시행일 확정']
    ];
    const steps = defs.map(([label, sub], i) => {
      const done = i < cur, now = i === cur;
      const dot = 'width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; margin-top: 3px; ' +
        (done ? 'background: ' + accent + ';' : now ? 'background: #FFFFFF; border: 4px solid #C2410C;' : 'background: #FFFFFF; border: 2px solid #C9C6BD;');
      return {
        label, sub, current: now, notLast: i < defs.length - 1,
        dot,
        line: done ? accent : '#E4E2DB',
        labelStyle: 'font-size: 15px; ' + (now ? 'font-weight: 700; color: #16181D;' : done ? 'font-weight: 500; color: #16181D;' : 'font-weight: 500; color: #5B5F68;')
      };
    });
    const f = this.state.following;
    const followStyle = "width: 100%; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 17px 'IBM Plex Sans KR', sans-serif; cursor: pointer; " +
      (f ? 'background: #FFFFFF; color: ' + accent + '; border: 1.5px solid ' + accent + ';' : 'background: ' + accent + '; color: #FFFFFF; border: 0;');
    return {
      accent, steps, followStyle,
      followPressed: f ? 'true' : 'false',
      followLabel: f ? '알림 받는 중' : '이 법안 진행 알림 받기',
      toggleFollow: () => this.setState({ following: !f })
    };
  }
}
</script>
</body>
</html>

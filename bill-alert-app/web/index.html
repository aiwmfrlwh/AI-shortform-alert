<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F5F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="법안톡">
<title>법안톡 · 입법 알림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분하고 믿을 수 있는 시민용 앱, 쉬운 말
   IDEA: 국회 의안 진행표를 손안의 알림판으로
   PICTURE: 법안마다 6칸 진행 막대와 세로 타임라인, 쇼츠는 검은 화면 영상
   COLOUR and TYPE: 미색 바탕, 잉크, 파랑 하나, 진행 중은 주황 / IBM Plex Sans KR
   LAYOUT: 휴대폰 한 칸(최대 430px), 하단 탭, 데스크톱에서는 가운데 정렬 */
:root{color-scheme:light;--bg:#F6F5F1;--ink:#16181D;--mut:#5B5F68;--line:#E4E2DB;--card:#fff;--acc:#2346D8;--acc-soft:#EAEEFC;--now:#C2410C;--ok:#0F7A4A}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:#E9E7E1;color:var(--ink);font:16px/1.55 'IBM Plex Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc);text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:600px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.08)}}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.3px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative}
.icon-btn.plain{border:0;background:transparent}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:5px;background:var(--now);border:2px solid #fff}
h1{margin:0;font-size:24px;line-height:1.35;letter-spacing:-.5px}
h2{margin:0;font-size:17px}
.mut{color:var(--mut)}.sm{font-size:13px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.pill{flex:none;height:38px;padding:0 15px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px}
.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:flex;flex-direction:column;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);text-align:left;width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat{font-size:12px;font-weight:600;color:var(--acc);background:var(--acc-soft);padding:3px 8px;border-radius:6px;white-space:nowrap}
.bt{font-size:16px;font-weight:600;line-height:1.4;letter-spacing:-.2px}
.bar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.bar i{height:6px;border-radius:3px;background:var(--line)}
.bar i.d{background:var(--acc)}.bar i.n{background:var(--now)}
.st{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st b{color:var(--now)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--mut);font-size:14px}
.thumbs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.thumb{flex:none;width:112px;height:168px;border-radius:12px;background:#23252B center/cover;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:13px;font-weight:600;line-height:1.35;border:0;text-align:left;position:relative;overflow:hidden}
.thumb::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.thumb span{position:relative;z-index:1}
.thumb.soon{background:#2E3138;color:#B8BBC2}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:4px 8px calc(10px + env(safe-area-inset-bottom))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:11px;font-weight:500;color:var(--mut);position:relative}
.tabs a[aria-current=page]{color:var(--acc);font-weight:600}
.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--now);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.app.dark{background:#0E0F12}.app.dark .tabs{background:#0E0F12;border-color:#23252B}.app.dark .tabs a{color:#9DA1AA}.app.dark .tabs a[aria-current=page]{color:#fff}
/* onboarding */
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:1}
.steps3 i{height:4px;border-radius:2px;background:var(--line)}.steps3 i.on{background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.cta{height:56px;border-radius:14px;background:var(--acc);color:#fff;border:0;font-size:17px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.cta:disabled{opacity:.4;cursor:not-allowed}
.cta.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.sticky{position:sticky;bottom:0;padding:12px 20px 16px;background:var(--bg);border-top:1px solid var(--line)}
/* detail */
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.box h3{margin:0 0 6px;font-size:13px;color:var(--acc)}
.box p,.box ul{margin:0;font-size:14px;line-height:1.65;color:#2A2D33}
.box ul{padding-left:18px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.side h3.pro{color:var(--ok)}.side h3.con{color:#B42318}
.tl{display:flex;flex-direction:column}
.ts{display:flex;gap:12px}
.ts .rail{display:flex;flex-direction:column;align-items:center;width:20px}
.ts .k{width:14px;height:14px;border-radius:7px;margin-top:4px;background:#fff;border:2px solid #C9C6BD;flex:none}
.ts.d .k{background:var(--acc);border-color:var(--acc)}
.ts.n .k{border:4px solid var(--now)}
.ts .ln{width:2px;flex:1;min-height:20px;background:var(--line)}
.ts.d .ln{background:var(--acc)}
.ts .tx{flex:1;padding-bottom:14px;display:flex;justify-content:space-between;gap:8px}
.ts .tx b{font-size:15px;font-weight:500;display:block}
.ts.n .tx b{font-weight:700}.ts.t .tx b{color:var(--mut)}
.tag{font-size:12px;font-weight:700;color:#fff;background:var(--now);padding:2px 8px;border-radius:10px;height:fit-content;white-space:nowrap}
.watch{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:14px;padding:12px 14px;color:#fff;border:0;width:100%;text-align:left}
.src{font-size:12px;color:var(--mut);line-height:1.6}
.src a{color:var(--mut);text-decoration:underline}
/* shorts */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;background:#0E0F12;scrollbar-width:none}
.reel{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#1C1E23;overflow:hidden;color:#fff}
.reel video{width:100%;height:100%;object-fit:contain;background:#0E0F12}
.reel .tap{position:absolute;inset:0;border:0;background:transparent}
.reel .mute{position:absolute;top:14px;right:14px;height:36px;padding:0 12px;border-radius:18px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:600}
.side-acts{position:absolute;right:8px;bottom:120px;display:flex;flex-direction:column;gap:10px}
.side-acts button{width:56px;border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;padding:4px 0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.reel .meta{position:absolute;left:14px;right:76px;bottom:14px}
.linkcard{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;border:0;width:100%;text-align:left}
.linkcard small{display:block;font-size:11px;font-weight:600;color:var(--acc)}
.linkcard strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soonbox{text-align:center;padding:0 40px;color:#B8BBC2}
.soonbox strong{display:block;color:#fff;font-size:20px;margin:10px 0 6px}
/* alerts */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#ECEAE4;border-radius:12px;padding:4px}
.seg button{height:42px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-size:14px;font-weight:500}
.seg button[aria-checked=true],.seg button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.set{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 16px}
.set .r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;border-bottom:1px solid #EFEDE7}
.set .r:last-child{border-bottom:0}
.sw{width:52px;height:32px;border-radius:16px;border:0;padding:0;position:relative;background:#C9C6BD;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true]::after{left:23px}
.noti{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #EFEDE7;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.noti .ic{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;flex:none}
.noti.unread .ic{background:#FDEBDD}
.noti p{margin:0;font-size:14px;line-height:1.5}
#toast{position:absolute;left:16px;right:16px;top:12px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:9}
#toast.on{transform:none}
@media(prefers-reduced-motion:reduce){#toast,.sw,.sw::after{transition:none}}
</style>
</head>
<body>

/* ---- router ---- */
const app = document.getElementById('app'), view = document.getElementById('view'), tabs = document.getElementById('tabs');
function route(){
  let h = location.hash.slice(1) || (S.onboarded ? 'home' : 'interests');
  let html, tab = h;
  if (h.startsWith('bill-')) { html = viewBill(h.slice(5)); tab = 'home'; }
  else if (h === 'shorts') html = viewShorts();
  else if (h === 'alerts') html = viewAlerts();
  else if (h === 'interests') html = viewInterests();
  else { html = viewHome(); tab = 'home'; }
  view.innerHTML = html;
  app.classList.toggle('dark', h === 'shorts');
  const t = (k, l, i) => `<a href="#${k}" ${tab === k ? 'aria-current="page"' : ''}>${ic(i)}${l}${k === 'alerts' && unread() ? `<span class="badge">${unread()}</span>` : ''}</a>`;
  tabs.innerHTML = t('home','홈','home') + t('shorts','쇼츠','shorts') + t('alerts','알림','bell') + t('interests','내 관심','user');
  if (h === 'shorts') {
    setupFeed();
    if (focusReel) { const r = document.getElementById('reel-' + focusReel); if (r) r.scrollIntoView({block:'start'}); focusReel = null; }
  }
}
let keepScroll = false, focusReel = null;
function rerender(){ const y = view.scrollTop; route(); if (keepScroll) view.scrollTop = y; }

/* ---- shorts autoplay ---- */
let io;
function setupFeed(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target.querySelector('video'); if (!v) return;
    if (e.isIntersecting) v.play().catch(() => {}); else v.pause();
  }), {threshold: .6});
  document.querySelectorAll('.reel').forEach(r => io.observe(r));
}

/* ---- events ---- */
view.addEventListener('click', e => {
  const el = e.target.closest('button,[data-go]'); if (!el) return;
  const d = el.dataset;
  keepScroll = true;
  if (d.go) { keepScroll = false; focusReel = d.reel || null; if (location.hash === '#' + d.go) route(); else location.hash = d.go; return; }
  if (d.filter) { S.filter = d.filter; }
  else if (d.cat) { S.interests = S.interests.includes(d.cat) ? S.interests.filter(c => c !== d.cat) : [...S.interests, d.cat]; }
  else if (d.stage) { S.stages[+d.stage] = !S.stages[+d.stage]; }
  else if (d.mode) { S.mode = d.mode; }
  else if (d.alerttab) { S.alertTab = d.alerttab; }
  else if (d.noti) { const n = NOTIS.find(x => x.id === d.noti); if (!S.read.includes(n.id)) S.read.push(n.id); save(); keepScroll = false; location.hash = 'bill-' + n.bill; return; }
  else if (d.act === 'done') { S.onboarded = true; save(); keepScroll = false; toast('관심 분야 ' + S.interests.length + '개를 저장했어요'); location.hash = 'home'; return; }
  else if (d.act === 'follow') { const on = following(d.id); S.follow = on ? S.follow.filter(x => x !== d.id) : [...S.follow, d.id]; toast(on ? '알림을 껐어요' : '단계가 바뀌면 바로 알려드릴게요'); }
  else if (d.act === 'shortsAlert') { S.shortsAlert = !S.shortsAlert; }
  else if (d.act === 'like' || d.act === 'save') {
    const k = d.act === 'like' ? 'liked' : 'saved', on = S[k].includes(d.id);
    S[k] = on ? S[k].filter(x => x !== d.id) : [...S[k], d.id]; save();
    const v = el.closest('.reel').querySelector('video'), t = v ? v.currentTime : 0;
    // update just this button without reloading the video
    if (k === 'liked') { const svg = el.querySelector('svg'); svg.setAttribute('fill', on ? 'none' : '#F0536B'); svg.setAttribute('stroke', on ? '#fff' : '#F0536B'); }
    else { el.querySelector('svg').setAttribute('fill', on ? 'none' : '#fff'); el.lastChild.textContent = on ? '저장' : '저장됨'; toast(on ? '저장을 취소했어요' : '저장한 쇼츠에 담았어요'); }
    el.setAttribute('aria-pressed', !on); return;
  }
  else if (d.act === 'playpause') { const v = el.parentNode.querySelector('video'); v.paused ? v.play().catch(() => {}) : v.pause(); return; }
  else if (d.act === 'mute') { const v = el.parentNode.querySelector('video'); v.muted = !v.muted; if (!v.muted) v.play().catch(() => {}); el.textContent = v.muted ? '소리 켜기' : '소리 끄기'; return; }
  else if (d.act === 'share') {
    const url = location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('링크를 복사했어요'), () => toast('공유: ' + url));
    else toast('공유: ' + url);
    return;
  }
  else if (d.act === 'test') {
    const msg = '건보공단 특사경법 — 법사위 전체회의 재논의 일정이 잡히면 이렇게 알려드려요';
    toast(msg);
    try { if ('Notification' in window) Notification.requestPermission().then(p => { if (p === 'granted') new Notification('법안톡', {body: msg}); }).catch(() => {}); } catch(err) {}
    return;
  }
  else return;
  save(); rerender();
});
window.addEventListener('hashchange', () => { keepScroll = false; route(); view.scrollTop = 0; });
route();
}
</script>
</body>
</html>

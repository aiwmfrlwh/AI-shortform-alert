<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈 · 입법 소식</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2346D8;text-decoration:none}a:hover{color:#1A35A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; font-family: 'IBM Plex Sans KR', sans-serif; color: #16181D; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 32px; height: 32px; border-radius: 9px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V10"></path><path d="M19 21V10"></path><path d="M9 21V10"></path><path d="M15 21V10"></path><path d="M2 10l10-6 10 6"></path></svg>
      </div>
      <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.3px">법안톡</span>
    </div>
    <a href="Alerts.dc.html" aria-label="알림 설정" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E4E2DB; display: flex; align-items: center; justify-content: center; position: relative; color: #16181D">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 4px; background: #C2410C; border: 2px solid #FFFFFF"></span>
    </a>
  </header>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 4px 20px 0">
    <section style="display: flex; flex-direction: column; gap: 4px">
      <p style="margin: 0; font-size: 14px; color: #5B5F68">오늘의 입법 소식</p>
      <h1 style="margin: 0; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -0.5px">관심 법안에 새로운<br>진행 소식이 있어요</h1>
    </section>

    <div style="display: flex; gap: 8px">
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #16181D; color: #FFFFFF; font: 600 14px 'IBM Plex Sans KR', sans-serif">전체</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E4E2DB; background: #FFFFFF; color: #16181D; font: 500 14px 'IBM Plex Sans KR', sans-serif">팔로우 법안</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E4E2DB; background: #FFFFFF; color: #16181D; font: 500 14px 'IBM Plex Sans KR', sans-serif">관심 분야</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{bills}}" as="bill" hint-placeholder-count="3">
        <a href="BillDetail.dc.html" style="display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border: 1px solid #E4E2DB; border-radius: 16px; padding: 16px; color: #16181D">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <span style="font-size: 12px; font-weight: 600; color: {{accent}}; background: #EAEEFC; padding: 4px 8px; border-radius: 6px">{{bill.cat}}</span>
            <span style="font-size: 12px; color: #5B5F68">{{bill.time}}</span>
          </div>
          <div style="font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -0.2px">{{bill.title}}</div>
          <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
            <sc-for list="{{bill.segs}}" as="seg" hint-placeholder-count="6">
              <div style="height: 6px; border-radius: 3px; background: {{seg.bg}}"></div>
            </sc-for>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 13px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
            <span style="font-weight: 600; color: #C2410C">{{bill.update}}</span>
            <span style="color: #5B5F68">· {{bill.stage}}</span>
          </div>
        </a>
      </sc-for>
    </div>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700">관심 분야 쇼츠</h2>
        <a href="Shorts.dc.html" style="font-size: 14px; font-weight: 500; min-height: 44px; display: flex; align-items: center">전체 보기</a>
      </div>
      <div style="display: flex; gap: 10px">
        <a href="Shorts.dc.html" style="width: 112px; height: 168px; border-radius: 12px; background: #23252B; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; color: #FFFFFF; font-size: 13px; font-weight: 600; line-height: 1.35">전세사기 피해 지원, 무엇이 바뀌나</a>
        <a href="Shorts.dc.html" style="width: 112px; height: 168px; border-radius: 12px; background: #2E3138; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; color: #FFFFFF; font-size: 13px; font-weight: 600; line-height: 1.35">주 4.5일제 논의, 1분 정리</a>
        <a href="Shorts.dc.html" style="width: 112px; height: 168px; border-radius: 12px; background: #23252B; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; color: #FFFFFF; font-size: 13px; font-weight: 600; line-height: 1.35">AI 기본법, 내 일상엔?</a>
      </div>
    </section>
  </div>

  <nav aria-label="하단 메뉴" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E4E2DB; padding: 6px 8px 22px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 600; color: {{accent}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>홈</a>
    <a href="Shorts.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5B5F68">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"></rect><path d="M10 9l5 3-5 3z"></path></svg>쇼츠</a>
    <a href="Alerts.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5B5F68">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>알림</a>
    <a href="Interests.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #5B5F68">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>내 관심</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2346D8","options":["#2346D8","#0F766E","#6D28D9","#16181D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2346D8';
    const segs = (cur) => [0,1,2,3,4,5].map((i) => ({ bg: i < cur ? accent : (i === cur ? '#C2410C' : '#E4E2DB') }));
    return {
      accent,
      bills: [
        { cat: '주거·부동산', time: '2시간 전', title: '주택임대차보호법 일부개정법률안', update: '위원회 심사 시작', stage: '3/6단계', segs: segs(2) },
        { cat: '노동·일자리', time: '어제', title: '근로기준법 일부개정법률안', update: '법사위 회부', stage: '4/6단계', segs: segs(3) },
        { cat: '디지털·AI', time: '3일 전', title: '개인정보 보호법 일부개정법률안', update: '본회의 상정 예정', stage: '5/6단계', segs: segs(4) }
      ]
    };
  }
}
</script>
</body>
</html>

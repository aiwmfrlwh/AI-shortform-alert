name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["bill-alert-app/web/**", "api-server/output/**", ".github/workflows/pages.yml"]
  # 법안 자동 업데이트(Update bills)가 끝나면 새 데이터로 다시 배포한다.
  # (봇이 올린 커밋은 push 이벤트를 일으키지 않아서 따로 연결해야 한다)
  workflow_run:
    workflows: ["Update bills"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 최신 국회 법안 데이터를 웹앱에 싣기
        run: |
          mkdir -p bill-alert-app/web/data
          cp api-server/output/new_bills.json api-server/output/bills.json bill-alert-app/web/data/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bill-alert-app/web
      - id: deployment
        uses: actions/deploy-pages@v4

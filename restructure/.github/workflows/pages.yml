name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", "scripts/build_site.py", ".github/workflows/pages.yml"]
  # 법안 자동 업데이트(Update bills)가 끝나면 새 데이터로 다시 배포한다.
  # (봇이 올린 커밋은 push 이벤트를 일으키지 않아서 따로 연결해야 한다)
  workflow_run:
    workflows: ["Update bills"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # web/ 코드 + data/ 데이터를 검사하고 _site/ 로 모은다 (내 컴퓨터 미리보기와 같은 스크립트)
      - name: 데이터 검사, 배포 폴더 만들기
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

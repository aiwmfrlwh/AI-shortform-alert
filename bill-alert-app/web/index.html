<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F5F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="법안톡">
<title>법안톡 · 입법 알림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분하고 믿을 수 있는 시민용 앱, 쉬운 말
   IDEA: 국회 의안 진행표를 손안의 알림판으로
   PICTURE: 법안마다 6칸 진행 막대와 세로 타임라인, 쇼츠는 검은 화면 영상
   COLOUR and TYPE: 미색 바탕, 잉크, 파랑 하나, 진행 중은 주황 / IBM Plex Sans KR
   LAYOUT: 휴대폰 한 칸(최대 430px), 하단 탭, 데스크톱에서는 가운데 정렬 */
:root{color-scheme:light;--bg:#F6F5F1;--ink:#16181D;--mut:#5B5F68;--line:#E4E2DB;--card:#fff;--acc:#2346D8;--acc-soft:#EAEEFC;--now:#C2410C;--ok:#0F7A4A}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:#E9E7E1;color:var(--ink);font:16px/1.55 'IBM Plex Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc);text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:600px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.08)}}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.3px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center}
.logo svg{stroke:#fff;stroke-width:2}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative}
.icon-btn.plain{border:0;background:transparent}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:5px;background:var(--now);border:2px solid #fff}
h1{margin:0;font-size:24px;line-height:1.35;letter-spacing:-.5px}
h2{margin:0;font-size:17px}
.mut{color:var(--mut)}.sm{font-size:13px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.pill{flex:none;height:38px;padding:0 15px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px}
.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:flex;flex-direction:column;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);text-align:left;width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat{font-size:12px;font-weight:600;color:var(--acc);background:var(--acc-soft);padding:3px 8px;border-radius:6px;white-space:nowrap}
.bt{font-size:16px;font-weight:600;line-height:1.4;letter-spacing:-.2px}
.bar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.bar i{height:6px;border-radius:3px;background:var(--line)}
.bar i.d{background:var(--acc)}.bar i.n{background:var(--now)}
.st{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st b{color:var(--now)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--mut);font-size:14px}
.thumbs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.thumb{flex:none;width:112px;height:168px;border-radius:12px;background:#23252B center/cover;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:13px;font-weight:600;line-height:1.35;border:0;text-align:left;position:relative;overflow:hidden}
.thumb::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.thumb span{position:relative;z-index:1}
.thumb.soon{background:#2E3138;color:#B8BBC2}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:4px 8px calc(10px + env(safe-area-inset-bottom))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:11px;font-weight:500;color:var(--mut);position:relative}
.tabs a[aria-current=page]{color:var(--acc);font-weight:600}
.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--now);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.app.dark{background:#0E0F12}.app.dark .tabs{background:#0E0F12;border-color:#23252B}.app.dark .tabs a{color:#9DA1AA}.app.dark .tabs a[aria-current=page]{color:#fff}
/* onboarding */
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:1}
.steps3 i{height:4px;border-radius:2px;background:var(--line)}.steps3 i.on{background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.cta{height:56px;border-radius:14px;background:var(--acc);color:#fff;border:0;font-size:17px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.cta:disabled{opacity:.4;cursor:not-allowed}
.cta.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.sticky{position:sticky;bottom:0;padding:12px 20px 16px;background:var(--bg);border-top:1px solid var(--line)}
/* detail */
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.box h3{margin:0 0 6px;font-size:13px;color:var(--acc)}
.box p,.box ul{margin:0;font-size:14px;line-height:1.65;color:#2A2D33}
.box ul{padding-left:18px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.side h3.pro{color:var(--ok)}.side h3.con{color:#B42318}
.tl{display:flex;flex-direction:column}
.ts{display:flex;gap:12px}
.ts .rail{display:flex;flex-direction:column;align-items:center;width:20px}
.ts .k{width:14px;height:14px;border-radius:7px;margin-top:4px;background:#fff;border:2px solid #C9C6BD;flex:none}
.ts.d .k{background:var(--acc);border-color:var(--acc)}
.ts.n .k{border:4px solid var(--now)}
.ts .ln{width:2px;flex:1;min-height:20px;background:var(--line)}
.ts.d .ln{background:var(--acc)}
.ts .tx{flex:1;padding-bottom:14px;display:flex;justify-content:space-between;gap:8px}
.ts .tx b{font-size:15px;font-weight:500;display:block}
.ts.n .tx b{font-weight:700}.ts.t .tx b{color:var(--mut)}
.tag{font-size:12px;font-weight:700;color:#fff;background:var(--now);padding:2px 8px;border-radius:10px;height:fit-content;white-space:nowrap}
.watch{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:14px;padding:12px 14px;color:#fff;border:0;width:100%;text-align:left}
.src{font-size:12px;color:var(--mut);line-height:1.6}
.src a{color:var(--mut);text-decoration:underline}
/* shorts */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;background:#0E0F12;scrollbar-width:none}
.reel{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#1C1E23;overflow:hidden;color:#fff}
.reel video{width:100%;height:100%;object-fit:contain;background:#0E0F12}
.reel .tap{position:absolute;inset:0;border:0;background:transparent}
.reel .mute{position:absolute;top:14px;right:14px;height:36px;padding:0 12px;border-radius:18px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:600}
.side-acts{position:absolute;right:8px;bottom:120px;display:flex;flex-direction:column;gap:10px}
.side-acts button{width:56px;border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;padding:4px 0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.reel .meta{position:absolute;left:14px;right:76px;bottom:14px}
.linkcard{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;border:0;width:100%;text-align:left}
.linkcard small{display:block;font-size:11px;font-weight:600;color:var(--acc)}
.linkcard strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soonbox{text-align:center;padding:0 40px;color:#B8BBC2}
.soonbox strong{display:block;color:#fff;font-size:20px;margin:10px 0 6px}
/* alerts */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#ECEAE4;border-radius:12px;padding:4px}
.seg button{height:42px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-size:14px;font-weight:500}
.seg button[aria-checked=true],.seg button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.set{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 16px}
.set .r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;border-bottom:1px solid #EFEDE7}
.set .r:last-child{border-bottom:0}
.sw{width:52px;height:32px;border-radius:16px;border:0;padding:0;position:relative;background:#C9C6BD;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true]::after{left:23px}
.noti{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #EFEDE7;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.noti .ic{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;flex:none}
.noti.unread .ic{background:#FDEBDD}
.noti p{margin:0;font-size:14px;line-height:1.5}
#toast{position:absolute;left:16px;right:16px;top:12px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;transform:translateY(calc(-100% - 40px));visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:9}
#toast.on{transform:none;visibility:visible}
@media(prefers-reduced-motion:reduce){#toast,.sw,.sw::after{transition:none}}
.tabs{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.tabs[hidden]{display:none!important}
.onb{display:flex;flex-direction:column;gap:22px;min-height:100%}
.link-btn{display:flex;align-items:center;justify-content:center;width:100%;height:44px;margin-top:4px;border:0;background:transparent;color:var(--mut);font-size:14px;font-weight:500}
.feat{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500}
.fi{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.push{display:flex;gap:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(22,24,29,.08)}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.opt b{font-size:16px;font-weight:600}
.opt .ring{width:22px;height:22px;border-radius:11px;border:2px solid #C9C6BD;flex:none;box-sizing:border-box}
.opt[aria-checked=true]{border:2px solid var(--acc);padding:13px 15px}.opt[aria-checked=true] .ring{border:7px solid var(--acc)}
.term{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-decoration:underline dotted var(--acc) 2px;text-underline-offset:4px;cursor:pointer}
.term:hover{color:var(--acc)}
.hint{display:flex;align-items:center;gap:6px;margin:10px 0 0!important;font-size:12px!important;color:var(--mut)!important}
.tipcard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink)}
.tipcard b{font-size:16px}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--mut)}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);height:100%}
.flowbox{background:var(--acc-soft);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.flow{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fstep{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 6px;border-radius:20px;border:0;background:#fff;font-size:13px;font-weight:600;color:var(--ink)}
.fstep span{width:26px;height:26px;border-radius:13px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px}
.arr{color:var(--acc);font-weight:700;flex:none}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;scroll-margin:20px}
.tcard h3{margin:0;font-size:18px;letter-spacing:-.3px}
.tcard.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
.exlink{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;min-height:32px}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#ECEAE4;border-radius:12px;padding:4px}
.seg3 button{height:42px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-size:14px;font-weight:500}
.seg3 button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{aspect-ratio:9/16;border-radius:14px;border:0;background:#23252B center/cover;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px;color:#fff;font-size:14px;font-weight:600;text-align:left}
.tile::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.tile span{position:relative;z-index:1}
.rowbtn{border:0;background:transparent;padding:0;text-align:left;color:var(--ink);width:100%}
.mini{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--mut);flex:none}
.on-chip{height:36px;display:inline-flex;align-items:center;background:var(--acc-soft);border-color:transparent;color:var(--acc);font-weight:600;font-size:14px}
.scrim{position:absolute;inset:0;background:rgba(14,15,18,.4);z-index:20;display:none;align-items:flex-end}
.scrim.on{display:flex}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.12);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet,.tcard.flash{animation:none}}
.searchbar{display:flex;align-items:center;gap:10px;width:100%;height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:15px;text-align:left}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;border:0;background:transparent;padding:0;text-align:left;color:var(--ink)}
.rt{font-size:15px;font-weight:600;line-height:1.4}
.rbtn{flex:none;display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 12px;border-radius:19px;border:1.5px solid var(--acc);background:#fff;color:var(--acc);font-size:13px;font-weight:600;white-space:nowrap}
.rbtn.play{background:var(--ink);border-color:var(--ink);color:#fff}
.rbtn.making{border-color:transparent;background:#FDEBDD;color:var(--now)}
.sgroup{display:flex;flex-direction:column;gap:10px}
.seg4{grid-template-columns:repeat(4,minmax(0,1fr))}
.reqbox{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--acc);border-radius:14px;padding:14px;color:var(--acc)}
.reqbox b{color:var(--ink);font-size:15px}
.making-box{border-color:transparent;background:#FDEBDD;color:var(--now)}
.making-box .sm{color:#7A3A12}
.more{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;color:var(--ink)}
.has-v{display:inline-flex;align-items:center;gap:3px;margin-left:auto;font-size:12px;font-weight:600;color:var(--ink);background:#EFEDE7;padding:2px 8px;border-radius:10px}
.mut.soon{color:var(--now);font-weight:600}
.hc{gap:10px}
.hmain{display:flex;flex-direction:column;gap:11px;width:100%;border:0;background:transparent;padding:0;text-align:left;color:var(--ink)}
.hmain .bar{display:grid}
.hfoot{border-top:1px solid #EFEDE7;padding-top:10px;margin-top:2px}
.hfoot .has-v{margin-left:0}
.fbtn{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--acc);background:#fff;color:var(--acc);font-size:13px;font-weight:600}
.fbtn[aria-pressed=true]{background:var(--acc-soft);border-color:transparent}
.vbtn{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:18px;border:0;background:var(--ink);color:#fff;font-size:13px;font-weight:600}
.vbtn.req{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.vbtn.making{background:#FDEBDD;color:var(--now)}
.period{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#ECEAE4;border-radius:12px;padding:4px}
.period button{height:40px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-size:14px;font-weight:500}
.period button[aria-checked=true]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.notfound{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.notfound b{font-size:16px}
.nf-links{display:flex;flex-direction:column;gap:8px}
.nf-link{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:12px;background:#F6F5F1;color:var(--ink)}
.nf-link>span{flex:1}.nf-link b{font-size:15px}
.cta:disabled.ghost{opacity:1;cursor:default}
.keep{background:#EAEEFC;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.keep-top{display:flex;gap:12px;align-items:flex-start}
.keep-top b{font-size:15px;line-height:1.45}
.keep-ic{width:36px;height:36px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.keep-btns{display:flex;align-items:center;gap:6px}.keep-btns .cta{flex:1}
.keep-link{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:36px;font-size:14px;font-weight:600}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.perks li{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.perks svg{color:var(--acc);flex:none}

async function loadData(){
  const get = async f => { try { const r = await fetch(f, {cache:'no-cache'}); return r.ok ? await r.json() : []; } catch(e) { return []; } };
  const [nb, det, pop, mem] = await Promise.all([get('data/new_bills.json'), get('data/bills.json'), get('data/popular.json'), get('data/members.json')]);
  const byId = {};
  (Array.isArray(det) ? det : []).forEach(d => byId[d.bill_id] = d);
  const seen = new Set(), list = [];
  (Array.isArray(nb) ? nb : []).forEach(r => { if (r && r.bill_id && !seen.has(r.bill_id)) { seen.add(r.bill_id); list.push(miniBill(r, byId[r.bill_id])); } });
  Object.values(byId).forEach(d => { if (!seen.has(d.bill_id)) { seen.add(d.bill_id); list.push(miniBill(d, d)); } });
  list.sort((a, b) => b.proposeDate.localeCompare(a.proposeDate));
  const popMap = {};
  (Array.isArray(pop) ? pop : []).forEach(p => { if (p && p.id) popMap[String(p.id)] = p; });
  const nbById = {};
  (Array.isArray(nb) ? nb : []).forEach(r => { if (r && r.bill_id) nbById[r.bill_id] = r; });
  BILLS.forEach(b => { if (b.bill_no && (byId[b.bill_no] || nbById[b.bill_no])) b.asm = asmInfo(nbById[b.bill_no], byId[b.bill_no]); });
  DATA = {loaded:true, list, pop:popMap, members:(mem && mem.members) || {}};
  const h = location.hash.slice(1);
  if (!h || h === 'home' || h === 'search' || h === 'library' || h === 'alerts' || /^bill-\d/.test(h)) rerender();
}

function searchBills(q){
  const nq = norm(q); if (!nq) return [];
  const keys = [nq, ...Object.keys(SYN).filter(k => nq.includes(k)).flatMap(k => SYN[k].map(norm))];
  const pool = [...BILLS, ...DATA.list];
  const score = b => {
    const hay = norm(b.title + ' ' + b.short), who = norm(b.proposer || '');
    let s = 0;
    keys.forEach((k, i) => { if (hay.includes(k)) s += i === 0 ? 10 : 6; });
    if (who.includes(nq)) s += 8;
    if (!s && (b.cats || []).some(c => norm(c).includes(nq))) s += 3;
    if (s && b.video) s += 2;
    return s;
  };
  return pool.map(b => [score(b), b]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 30).map(x => x[1]);
}

    const bs = S.requests.map(r => bill(r.id)).filter(Boolean);
    body = bs.length ? '<div class="rlist">' + bs.map(resultRow).join('') + '</div><p class="mut sm" style="margin:0">신청한 쇼츠가 완성되면 알림으로 알려드리고, 여기서 바로 볼 수 있어요.</p>'
      : (S.requests.length && !DATA.loaded ? '<div class="empty">불러오는 중이에요…</div>' : `<div class="empty">영상이 없는 법안도 쇼츠를 신청할 수 있어요.<br><a href="#search">법안 찾기</a>에서 궁금한 법안을 검색해 보세요.</div>`);
  }
  else if (S.libTab === 'liked') body = (tiles(S.liked) ? '<p class="mut sm" style="margin:0 0 10px">공감한 분야의 쇼츠를 먼저 보여드려요.</p>' + tiles(S.liked) : '<div class="empty">쇼츠에서 공감을 누르면 여기에 모여요.</div>');
  else {
    const bs = S.follow.map(bill).filter(Boolean);
    body = bs.length ? '<div class="cards">' + bs.map(b => `<div class="card" style="gap:8px"><button class="rowbtn" data-go="bill-${b.id}"><span class="cat">${esc(b.cat)}</span><span class="bt" style="display:block;margin-top:8px">${esc(b.title)}</span></button>${bar(b)}
      <div class="row"><span class="st"><b>${esc(b.status)}</b></span><button class="mini" data-act="follow" data-id="${b.id}">팔로우 취소</button></div></div>`).join('') + '</div>'
      : '<div class="empty">홈 카드나 법안 상세에서 "팔로우"를 누르면<br>여기서 한꺼번에 관리할 수 있어요.</div>';
  }
  const hasRecords = S.saved.length + S.liked.length + S.follow.length + S.requests.length > 0;
  const banner = !hasRecords ? '' : S.signupHidden
    ? `<a class="keep-link" href="#signup">${ic('user',16)}가입하고 보관함 지키기</a>`
    : `<section class="keep"><div class="keep-top"><span class="keep-ic">${ic('save',20)}</span><span style="flex:1"><b>보관함이 초기화되지 않게 가입을 추천드려요</b>
        <span class="sm" style="display:block;margin-top:2px;color:#3B4252">지금은 이 브라우저에만 저장돼요. 기록을 지우거나 기기를 바꾸면 사라질 수 있어요.</span></span></div>
        <div class="keep-btns"><a class="cta" href="#signup" style="height:44px;font-size:15px">법안톡 가입하기</a><button class="link-btn" data-act="hideSignup" style="margin:0;width:auto;padding:0 16px">나중에 할게요</button></div></section>`;
  return `<div class="pad" style="display:flex;flex-direction:column;gap:14px"><h1>보관함</h1>${banner}
    <div class="seg3 seg4" role="tablist">${tab('saved','저장', S.saved.length)}${tab('liked','공감', S.liked.length)}${tab('req','신청', S.requests.length)}${tab('follow','팔로우', S.follow.length)}</div>
    ${body}
    <section class="box" style="margin-top:6px"><div class="row"><h3 style="margin:0;color:var(--ink);font-size:15px">내 관심 분야</h3><a href="#interests" style="font-size:14px;min-height:44px;display:flex;align-items:center">편집</a></div>
      <div class="chips" style="gap:8px">${S.interests.length ? S.interests.map(c => `<span class="chip on-chip">${esc(c)}</span>`).join('') : '<span class="mut sm">아직 고른 분야가 없어요</span>'}</div></section>
  </div>`;
}

function viewAlerts(){
  const tab = (k, l) => `<button role="tab" aria-selected="${S.alertTab === k}" data-alerttab="${k}">${l}</button>`;
  let body;
  if (S.alertTab === 'inbox') {
    const all = allNotis().filter(n => following(n.bill) && !S.cleared.includes(n.id)).sort((a, b) => b.date.localeCompare(a.date));
    const isRead = n => S.read.includes(n.id);
    const un = all.filter(n => !isRead(n)).length, readN = all.length - un;
    const list = S.unreadOnly ? all.filter(n => !isRead(n)) : all;
    const chip = (v, l) => `<button class="pill" data-unreadonly="${v}" aria-pressed="${S.unreadOnly === v}">${l}</button>`;
    body = all.length ? `<div class="row nbar"><div class="pills">${chip(false, '전체 ' + all.length)}${chip(true, '안 읽음 ' + un)}</div>
        <button class="mini" data-act="readAll" ${un ? '' : 'disabled'}>${ic('check',14)}모두 읽음</button></div>` : '';
    body += list.length ? '<div>' + list.map(n => `<div class="noti ${isRead(n) ? 'read' : 'unread'}">
        <button class="nmain" data-noti="${n.id}"><span class="ic">${ic('bell',20)}${isRead(n) ? '' : '<i class="udot" aria-hidden="true"></i>'}</span>
          <span style="flex:1"><p>${isRead(n) ? '' : '<span class="sr">안 읽음, </span>'}${esc(n.text)}</p><span class="mut sm">${n.date}</span></span></button>
        ${isRead(n) ? '' : `<button class="nread" data-readone="${n.id}" aria-label="읽음으로 표시">${ic('check',18)}</button>`}</div>`).join('') + '</div>'
      : `<div class="empty">${all.length ? '안 읽은 알림이 없어요. 모두 확인했어요!' : '팔로우한 법안의 알림이 여기에 쌓여요.'}</div>`;
    if (readN && !S.unreadOnly) body += `<button class="link-btn" data-act="clearRead">읽은 알림 ${readN}개 지우기</button>`;
    body += `<button class="cta ghost" data-act="test" style="margin-top:16px">${ic('bell',18)}테스트 알림 보내기</button>`;
  } else {
    body = `<p class="mut sm" style="margin:0 0 8px">팔로우한 법안이 어느 단계에 오면 알려드릴까요?</p>
    <div class="set">${STAGES.map((s, i) => `<div class="r"><span id="st${i}" style="font-size:15px;font-weight:500">${s}</span>
      <button class="sw" role="switch" aria-checked="${S.stages[i]}" aria-labelledby="st${i}" data-stage="${i}"></button></div>`).join('')}</div>
    <h2 style="font-size:15px;margin:18px 0 8px">받는 방식</h2>
    <div class="seg" role="radiogroup" aria-label="받는 방식"><button role="radio" aria-checked="${S.mode === 'instant'}" data-mode="instant">즉시 알림</button><button role="radio" aria-checked="${S.mode === 'digest'}" data-mode="digest">하루 한 번 요약</button></div>
    <p class="mut sm" style="margin:8px 0 18px">${S.mode === 'instant' ? '단계가 바뀌는 즉시 알려드려요.' : '매일 아침 8시, 하루 동안의 변화를 모아서 보내드려요.'}</p>
    <div class="set"><div class="r"><span id="sa" style="font-size:15px;font-weight:500">관심 분야 새 쇼츠</span><button class="sw" role="switch" aria-checked="${S.shortsAlert}" aria-labelledby="sa" data-act="shortsAlert"></button></div></div>`;
  }
  return `<div class="pad" style="display:flex;flex-direction:column;gap:14px"><h1>알림</h1>
    <div class="seg" role="tablist">${tab('inbox','알림함' + (unread() ? ' ' + unread() : ''))}${tab('settings','설정')}</div>${body}</div>`;
}

/* ---- term sheet ---- */
const scrim = document.getElementById('scrim'), sheet = document.getElementById('sheet');
let lastFocus = null;
function openTerm(i){
  const x = TERMS[+i]; if (!x) return;
  const b = x.ex && location.hash !== '#bill-' + x.ex && bill(x.ex);
  lastFocus = document.activeElement;
  sheet.innerHTML = `<div class="grab" aria-hidden="true"></div><div class="row"><span class="mut" style="font-size:12px">${esc(TERM_CATS[x.c])}</span><button class="icon-btn plain" data-close="1" aria-label="닫기" style="margin:-10px -12px -10px 0">${ic('x',20)}</button></div>
    <h2 id="sheet-title" style="font-size:22px;margin:2px 0 8px">${esc(x.t)}</h2>
    <p style="margin:0;font-size:16px;line-height:1.65">${esc(x.d)}</p>
    ${x.law ? `<p class="mut" style="font-size:12px;margin:10px 0 0">근거: ${esc(x.law)}</p>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:18px">
      ${b ? `<a class="cta ghost" href="#bill-${b.id}" data-close="1">이 말이 나온 법안: ${esc(b.short)}</a>` : ''}
      <a class="link-btn" href="#terms" data-close="1" data-jump="${x.i}">용어 사전에서 더 보기</a></div>`;
  scrim.classList.add('on'); scrim.setAttribute('aria-hidden', 'false');
  sheet.querySelector('[data-close]').focus();
}
function closeTerm(){ scrim.classList.remove('on'); scrim.setAttribute('aria-hidden', 'true'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
scrim.addEventListener('click', e => {
  if (e.target === scrim) return closeTerm();
  const c = e.target.closest('[data-close]'); if (!c) return;
  if (c.dataset.jump) { jumpTerm = c.dataset.jump; termQuery = ''; S.termCat = -1; save(); }
  closeTerm();
  if (c.getAttribute('href') === location.hash) { e.preventDefault(); route(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && scrim.classList.contains('on')) closeTerm(); });

/* ---- router ---- */
const app = document.getElementById('app'), view = document.getElementById('view'), tabs = document.getElementById('tabs');
let keepScroll = false, focusReel = null, jumpTerm = null;
function route(){
  let h = location.hash.slice(1) || (S.onboarded ? 'home' : 'welcome');
  let html, tab = h;
  const onb = ['welcome', 'notify'].includes(h) || (h === 'interests' && !S.onboarded);
  if (h.startsWith('bill-')) { html = viewBill(h.slice(5)); tab = 'home'; }
  else if (h === 'shorts') html = viewShorts();
  else if (h === 'alerts') html = viewAlerts();
  else if (h === 'terms') html = viewTerms();
  else if (h === 'search') { html = viewSearch(); tab = 'home'; }
  else if (h === 'signup') { html = viewSignup(); tab = 'library'; }
  else if (h === 'library') html = viewLibrary();
  else if (h === 'welcome') html = viewWelcome();
  else if (h === 'notify') html = viewNotify();
  else if (h === 'interests') { html = viewInterests(); tab = 'library'; }
  else { html = viewHome(); tab = 'home'; }
  view.innerHTML = html;
  app.classList.toggle('dark', h === 'shorts');
  tabs.hidden = onb;
  const t = (k, l, i) => `<a href="#${k}" ${tab === k ? 'aria-current="page"' : ''}>${ic(i)}${l}${k === 'alerts' && unread() ? `<span class="badge" aria-label="안 읽은 알림 ${unread()}개">${badgeNum()}</span>` : ''}</a>`;
  tabs.innerHTML = t('home','홈','home') + t('shorts','쇼츠','shorts') + t('terms','용어','book') + t('alerts','알림','bell') + t('library','보관함','save');
  if (h === 'shorts') {
    setupFeed();
    if (focusReel) { const r = document.getElementById('reel-' + focusReel); if (r) r.scrollIntoView({block:'start'}); focusReel = null; }
  }
  if (h === 'terms' && jumpTerm != null) {
    const el = document.getElementById('term-' + jumpTerm);
    if (el) { el.scrollIntoView({block:'center'}); el.classList.add('flash'); }
    jumpTerm = null;
  }
}
function rerender(){ const y = view.scrollTop; route(); if (keepScroll) view.scrollTop = y; }

/* ---- shorts autoplay ---- */
let io;
function setupFeed(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target.querySelector('video'); if (!v) return;
    if (e.isIntersecting) v.play().catch(() => {}); else v.pause();
  }), {threshold: .6});
  document.querySelectorAll('.reel').forEach(r => io.observe(r));
}

/* ---- events ---- */
view.addEventListener('input', e => {
  if (e.target.id === 'sq') { searchQuery = e.target.value; const box = document.getElementById('sres'); if (box) box.innerHTML = searchResults(); return; }
  if (e.target.id !== 'q') return;
  termQuery = e.target.value;
  const box = document.getElementById('termlist'); if (box) box.innerHTML = termList();
});
view.addEventListener('click', e => {
  const el = e.target.closest('button,[data-go]'); if (!el) return;
  const d = el.dataset;
  keepScroll = true;
  if (d.term) { openTerm(d.term); return; }
  if (d.go) { keepScroll = false; focusReel = d.reel || null; if (location.hash === '#' + d.go) route(); else location.hash = d.go; return; }
  if (d.suggest) { searchQuery = d.suggest; const i = document.getElementById('sq'); if (i) i.value = searchQuery; document.getElementById('sres').innerHTML = searchResults(); return; }
  if (d.act === 'readAll') { allNotis().forEach(n => { if (!S.read.includes(n.id)) S.read.push(n.id); }); save(); toast('알림을 모두 읽음으로 표시했어요'); rerender(); return; }
  if (d.readone) { if (!S.read.includes(d.readone)) S.read.push(d.readone); save(); rerender(); return; }
  if (d.act === 'clearRead') { allNotis().forEach(n => { if (S.read.includes(n.id) && !S.cleared.includes(n.id)) S.cleared.push(n.id); }); save(); toast('읽은 알림을 지웠어요'); rerender(); return; }
  if (d.unreadonly) { S.unreadOnly = d.unreadonly === 'true'; save(); rerender(); return; }
  if (d.billtab) { billTab.tab = d.billtab; rerender(); return; }
  if (d.act === 'termAsk') { const q = termQuery.trim(); if (q && !S.termAsks.includes(q)) S.termAsks.push(q); save(); toast('"' + q + '" 추가 요청을 받았어요'); const box = document.getElementById('termlist'); if (box) box.innerHTML = termList(); return; }
  if (d.act === 'hideSignup') { S.signupHidden = true; save(); rerender(); return; }
  if (d.act === 'sso') { toast('가입 기능은 준비 중이에요. 열리면 알려드릴게요'); return; }
  if (d.act === 'request') {
    if (!requested(d.id)) S.requests.push({id:d.id, at:mmdd(new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10))});
    if (!following(d.id)) S.follow.push(d.id);
    save(); toast('신청했어요. 쇼츠가 완성되면 바로 알려드릴게요');
    const box = document.getElementById('sres');
    if (box) { box.innerHTML = searchResults(); return; }
    rerender(); return;
  }
  if (d.act === 'more') { homeLimit += PAGE; const box = document.getElementById('homelist'); if (box) box.innerHTML = homeList(); return; }
  if (d.period) { S.period = d.period; homeLimit = PAGE; }
  else if (d.filter) { S.filter = d.filter; homeLimit = PAGE; }
  else if (d.termcat) { S.termCat = +d.termcat; }
  else if (d.libtab) { S.libTab = d.libtab; }
  else if (d.cat) { S.interests = S.interests.includes(d.cat) ? S.interests.filter(c => c !== d.cat) : [...S.interests, d.cat]; }
  else if (d.stage) { S.stages[+d.stage] = !S.stages[+d.stage]; }
  else if (d.mode) { S.mode = d.mode; }
  else if (d.alerttab) { S.alertTab = d.alerttab; }
  else if (d.noti) { const n = allNotis().find(x => x.id === d.noti); if (!S.read.includes(n.id)) S.read.push(n.id); save(); keepScroll = false; location.hash = 'bill-' + n.bill; return; }
  else if (d.act === 'skipInterests') { S.interests = []; save(); keepScroll = false; location.hash = 'notify'; return; }
  else if (d.act === 'toNotify') { save(); keepScroll = false; location.hash = 'notify'; return; }
  else if (d.act === 'saveInterests') { save(); keepScroll = false; toast('관심 분야 ' + S.interests.length + '개를 저장했어요'); location.hash = 'library'; return; }
  else if (d.act === 'skip' || d.act === 'finish') {
    S.onboarded = true; save(); keepScroll = false;
    if (d.perm) {
      toast('알림을 켰어요. 단계가 바뀌면 바로 알려드릴게요');
      try { if ('Notification' in window) Notification.requestPermission().catch(() => {}); } catch(err) {}
    }
    location.hash = 'home'; return;
  }
  else if (d.act === 'follow') { const on = following(d.id); S.follow = on ? S.follow.filter(x => x !== d.id) : [...S.follow, d.id]; toast(on ? '팔로우를 취소했어요. 알림도 함께 꺼져요' : '팔로우했어요. 단계가 바뀌면 바로 알려드릴게요'); }
  else if (d.act === 'shortsAlert') { S.shortsAlert = !S.shortsAlert; }
  else if (d.act === 'like' || d.act === 'save') {
    const k = d.act === 'like' ? 'liked' : 'saved', on = S[k].includes(d.id);
    S[k] = on ? S[k].filter(x => x !== d.id) : [...S[k], d.id]; save();
    if (k === 'liked') { const svg = el.querySelector('svg'); svg.setAttribute('fill', on ? 'none' : '#F0536B'); svg.setAttribute('stroke', on ? '#fff' : '#F0536B'); }
    else { el.querySelector('svg').setAttribute('fill', on ? 'none' : '#fff'); el.lastChild.textContent = on ? '저장' : '저장됨'; toast(on ? '저장을 취소했어요' : '보관함에 저장했어요'); }
    el.setAttribute('aria-pressed', !on); return;
  }
  else if (d.act === 'playpause') { const v = el.parentNode.querySelector('video'); v.paused ? v.play().catch(() => {}) : v.pause(); return; }
  else if (d.act === 'mute') { const v = el.parentNode.querySelector('video'); v.muted = !v.muted; if (!v.muted) v.play().catch(() => {}); el.textContent = v.muted ? '소리 켜기' : '소리 끄기'; return; }
  else if (d.act === 'share') {
    const url = location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('링크를 복사했어요'), () => toast('공유: ' + url));
    else toast('공유: ' + url);
    return;
  }
  else if (d.act === 'test') {
    const msg = '건보공단 특사경법 — 법사위 전체회의 재논의 일정이 잡히면 이렇게 알려드려요';
    toast(msg);
    try { if ('Notification' in window) Notification.requestPermission().then(p => { if (p === 'granted') new Notification('법안톡', {body: msg}); }).catch(() => {}); } catch(err) {}
    return;
  }
  else return;
  save(); rerender();
});
window.addEventListener('hashchange', () => { keepScroll = false; closeTerm(); const j = jumpTerm; route(); if (j == null) view.scrollTop = 0; if (location.hash === '#search') { const i = document.getElementById('sq'); if (i && !searchQuery) i.focus(); } });
route();
loadData();
}

</script>
</body>
</html>
